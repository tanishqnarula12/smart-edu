  <circle cx="992" cy="160" r="93" stroke="url(#accent)" stroke-opacity=".28" stroke-width="1" stroke-dasharray="2 9"/>
  <ellipse cx="992" cy="160" rx="134" ry="57" transform="rotate(-25 992 160)" stroke="url(#accent)" stroke-opacity=".48" stroke-width="1.2" stroke-dasharray="70 24 18 30"/>

