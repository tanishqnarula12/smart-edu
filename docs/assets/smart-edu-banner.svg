<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <title>Smart Edu — Smarter management. Better insights. Personalised education.</title>
  <desc>A glowing open book connected to students, parents, teachers and administrators.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1150" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B36"/><stop offset=".56" stop-color="#171A35"/><stop offset="1" stop-color="#301A46"/>
    </linearGradient>
    <linearGradient id="accent" x1="865" y1="72" x2="1088" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86F7E5"/><stop offset=".48" stop-color="#8A9CFF"/><stop offset="1" stop-color="#D895FF"/>
    </linearGradient>
    <linearGradient id="page" x1="927" y1="144" x2="1030" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7FFFC" stop-opacity=".96"/><stop offset="1" stop-color="#9DB0FF" stop-opacity=".82"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(170 0 0 142 990 160)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A9CFF" stop-opacity=".38"/><stop offset="1" stop-color="#8A9CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="837" y="13" width="310" height="294" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="bookGlow" x="894" y="91" width="202" height="156" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <path d="M0 256c188-40 309-31 462 9 153 40 260 19 403-24s224-51 335-12v91H0v-64Z" fill="#0B1328" fill-opacity=".58"/>
  <path d="M0 274c188-33 300-23 447 11 166 39 287 18 422-17 135-35 226-41 331-13" stroke="#5C719D" stroke-opacity=".16"/>

